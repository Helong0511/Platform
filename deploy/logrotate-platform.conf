# Platform 日志 logrotate 样例（Ubuntu）
# 安装：sudo cp deploy/logrotate-platform.conf /etc/logrotate.d/platform
#
# 重要：
# - 应用分类日志（error/warning/app/access/模块日志）已由 SafeRotatingFileHandler
#   按大小轮转，并由定时任务「清理文件日志」归档/超期清理。
# - 本配置仅兜底 gunicorn_*.log（进程层持续追加、应用内不负责内容轮转）。
# - 切勿对应用分类 *.log 再加 copytruncate，否则会与应用内轮转双轨冲突。

/data/Platform/logs/gunicorn_*.log
{
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    maxsize 50M
    su www-data www-data
}
