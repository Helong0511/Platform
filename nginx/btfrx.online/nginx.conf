# 定义Nginx运行的用户和组
user www-data;

# 根据CPU核心数自动设置worker进程数量
worker_processes auto;

# 存储主进程ID的文件路径
pid /run/nginx.pid;

# 包含已启用模块的配置文件
include /etc/nginx/modules-enabled/*.conf;

# 事件处理模块配置
events {
    # 每个worker进程同时打开的最大连接数（优化：增加到1024）
    worker_connections 1024;
    
    # 允许同时接受多个新连接
    multi_accept on;
    
    # 使用epoll事件模型（Linux优化）
    use epoll;
}

# HTTP服务器配置
http {
    # 开启高效文件传输模式
    sendfile on;
    
    # 仅在sendfile开启时有效，减少网络报文段数量
    tcp_nopush on;
    
    # 禁用Nagle算法，提高响应速度
    tcp_nodelay on;
    
    # 客户端保持连接超时时间
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # 服务器名字哈希表的最大值
    types_hash_max_size 2048;
    
    # 限制客户端请求体大小
    client_max_body_size 10m;
    
    # 客户端缓冲区配置
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # 包含MIME类型定义文件
    include /etc/nginx/mime.types;
    
    # 默认MIME类型
    default_type application/octet-stream;
    
    # 确保文本类型包含 charset
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # 支持的SSL/TLS协议版本（仅支持现代协议）
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # SSL会话缓存配置（优化：增加缓存大小）
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # 现代加密套件（优先使用TLS 1.3，移除TLS 1.2的弱加密套件）
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    
    # SSL优化配置
    ssl_prefer_server_ciphers off;  # TLS 1.3不需要此选项，但保留以兼容TLS 1.2
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # 访问日志和错误日志路径
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # 日志格式（包含更多信息）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # 开启Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/font-woff application/font-woff2;
    gzip_disable "msie6";
    
    # 限制连接速率和请求速率
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;  # 登录接口更严格
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # ----------------------------------------------------------------------------------- #
    # HTTP 重定向到 HTTPS
    server {
    if ($host = client.btfrx.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        listen [::]:80;
        server_name client.btfrx.online;
        
        # 安全头（HTTP也要添加）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        
        # 301永久重定向到HTTPS
        return 301 https://$host$request_uri;
    

}
    # ----------------------------------------------------------------------------------- #
    
    # ----------------------------------------------------------------------------------- #
    # HTTPS 监听
    server {
        listen 443 ssl http2;  # 启用HTTP/2
        listen [::]:443 ssl http2;
        server_name client.btfrx.online;
        
        # SSL 证书配置
        ssl_certificate /etc/letsencrypt/live/client.btfrx.online/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/client.btfrx.online/privkey.pem; # managed by Certbot
        
        # 安全头（完整配置）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        
        # Content-Security-Policy（与后端应用保持一致）
        # 注意：如果前端需要加载外部资源，需要调整此策略
        add_header Content-Security-Policy "default-src 'self';
	script-src 'self' 'unsafe-inline';
	style-src 'self' 'unsafe-inline';
	img-src 'self' data: https:;
	font-src 'self' data:;
	connect-src 'self';
	frame-ancestors 'none';
	base-uri 'self';
	form-action 'self';
	upgrade-insecure-requests" always;
        
        # 安全增强配置
        server_tokens off;
        client_max_body_size 10m;
        client_body_timeout 30s;
        client_header_timeout 30s;
        send_timeout 30s;
        
        # 前端静态文件
        root /data/Platform/frontend/dist;
        index index.html;
        
        # 处理 favicon.ico 请求
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            try_files /favicon.ico =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            expires 1y;
        }
        
        # bridge 路由代理（用于服务桥页静态资源）- 必须在最前面，避免被其他路由拦截
        location /bridge/ {
            # 直接代理到后端 FastAPI 应用
            proxy_pass http://127.0.0.1:8960;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲配置
            proxy_buffering off;
            proxy_http_version 1.1;
            
            # 缓存静态资源
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            
            # Content-Security-Policy: 允许加载图片资源（关键修复）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        }
        
        # 主请求处理
        location / {
            # 避免重定向循环
            try_files $uri $uri.html $uri/ @rewrite;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        location @rewrite {
            rewrite ^ /index.html last;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # 静态资源
        location /assets/ {
            alias /data/Platform/frontend/dist/assets/;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            expires 7d;
        }

        # 短链接重定向（必须在 API 代理之前，避免被前端路由拦截）
        location /s/ {
            # 直接代理到后端 FastAPI 应用
            proxy_pass http://127.0.0.1:8960;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲配置
            proxy_buffering off;  # 短链接重定向不需要缓冲
            proxy_http_version 1.1;
            
            # 不缓存短链接响应（重定向）
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # change 路由代理（用于打开 master.html 并跳转到指定URL）
        location /change/ {
            # 直接代理到后端 FastAPI 应用
            proxy_pass http://127.0.0.1:8960;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲配置
            proxy_buffering off;  # 不需要缓冲
            proxy_http_version 1.1;
            
            # 不缓存响应
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # report 路由代理（用于处理短链接点击上报）
        location /report {
            # 直接代理到后端 FastAPI 应用
            proxy_pass http://127.0.0.1:8960;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲配置
            proxy_buffering off;  # 不需要缓冲
            proxy_http_version 1.1;
            
            # 不缓存响应
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API 代理配置
        location /api/ {
            # 应用限流（API接口）
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            
            # 使用 127.0.0.1 而不是 0.0.0.0
            proxy_pass http://127.0.0.1:8960;

            # 代理头设置（标准配置）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Cloudflare 真实 IP（如果已配置 set_real_ip_from）
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Visitor $http_cf_visitor;

            # 超时配置（增加超时时间，避免 522 错误）
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # 缓冲配置（优化）
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            proxy_temp_file_write_size 8k;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
            
            # API 响应头
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # 登录接口特殊限流（更严格）
        location ~ ^/api/v1/auth/login$ {
            limit_req zone=login burst=3 nodelay;
            limit_conn addr 3;
            
            proxy_pass http://127.0.0.1:8960;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # 其他静态资源缓存
#         location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
#             add_header Cache-Control "public, max-age=604800, immutable" always;
#             add_header X-Content-Type-Options "nosniff" always;
#             access_log off;
#             expires 7d;
#         }
#         
        # 自定义错误页面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 禁止访问敏感文件
        location ~* \.(env|log|sql|bak|backup|old|tmp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    # ----------------------------------------------------------------------------------- #
}
