# 定义Nginx运行的用户和组
user www-data;

# 根据CPU核心数自动设置worker进程数量
worker_processes auto;

# 存储主进程ID的文件路径
pid /run/nginx.pid;

# 包含已启用模块的配置文件
include /etc/nginx/modules-enabled/*.conf;

# 事件处理模块配置
events {
    # 每个worker进程同时打开的最大连接数
    worker_connections 768;

    # 允许同时接受多个新连接
    multi_accept on;
}

# HTTP服务器配置
http {
    # 开启高效文件传输模式
    sendfile on;

    # 仅在sendfile开启时有效，减少网络报文段数量
    tcp_nopush on;

    # 禁用Nagle算法，提高响应速度
    tcp_nodelay on;

    # 客户端保持连接超时时间
    keepalive_timeout 65;

    # 服务器名字哈希表的最大值
    types_hash_max_size 2048;

    # 限制客户端请求体大小
    client_max_body_size 10m;

    # 包含MIME类型定义文件
    include /etc/nginx/mime.types;
    
    # 默认MIME类型
    default_type application/octet-stream;
    
    # 确保文本类型包含 charset
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 支持的SSL/TLS协议版本
    ssl_protocols TLSv1.2 TLSv1.3;

    # 优先使用服务器端的加密算法
    ssl_prefer_server_ciphers on;

    # SSL会话缓存配置
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 现代加密套件
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # 访问日志和错误日志路径
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 开启Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 限制连接速率和请求速率
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ----------------------------------------------------------------------------------- #
    # HTTPS 监听
    server {
        listen 80;
        listen [::]:80;

		server_name admin.king-sms.com client.king-sms.com king-sms.com api.king-sms.com www.king-sms.com;

        # ====== 安全响应头 ======
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ====== 安全增强配置 ======
        server_tokens off;
        client_max_body_size 10m;
        client_body_timeout 30s;
        client_header_timeout 30s;

        # ====== 日志配置 ======
        access_log /var/log/nginx/admin_king_sms_access.log;
        error_log /var/log/nginx/admin_king_sms_error.log;

        # ====== 前端静态文件 ======
        root /data/Platform/frontend/dist;
        index index.html;

        # 处理 favicon.ico 请求
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            try_files /favicon.ico =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 主请求处理
        location / {
            try_files $uri $uri.html $uri/ @rewrite;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            # 确保 HTML 响应包含 charset
            charset utf-8;
        }

        location @rewrite {
            rewrite ^ /index.html last;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            # 确保 HTML 响应包含 charset
            charset utf-8;
        }

        # 静态资源
        location /assets/ {
            alias /data/Platform/frontend/dist/assets/;
            # 移除 must-revalidate，使用更简洁的缓存策略
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            # 确保文本类型资源包含 charset
            charset utf-8;
        }

        # ====== 后端 API ======
        location /api {
            # 使用 127.0.0.1 而不是 0.0.0.0
            proxy_pass http://127.0.0.1:8960;

            # 代理头设置（Cloudflare 优化）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Cloudflare 真实 IP（如果已配置 set_real_ip_from）
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Visitor $http_cf_visitor;

            # 超时配置（增加超时时间，避免 522 错误）
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # API 响应头
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 其他静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            # 移除 must-revalidate，使用更简洁的缓存策略
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            # 确保 content-type 包含 charset（对于文本类型）
            charset utf-8;
        }

        # 健康检查端点（用于 Cloudflare 健康检查）
        location /health {
            proxy_pass http://127.0.0.1:8960/api/v1/health;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Cloudflare RUM 端点（添加 Cache-Control 头）
        location /cdn-cgi/rum {
            # RUM 数据不应该被缓存
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            # 返回空响应或代理到后端
            return 204;
        }

        # 自定义错误页面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    # -----------------------------------------------------------------------------------
}
