<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited-Time Free Spin – Win Big Now!</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a002f, #000);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* ===== 自适应转盘容器 ===== */
        .wrapper {
            position: relative;
            width: min(95vw, 800px);
            height: min(95vw, 800px);
            border-radius: 50%;
            background: radial-gradient(circle, #aa0000, #400000);
            box-shadow:
                inset 0 0 40px rgba(255, 255, 255, 0.4),
                0 20px 60px rgba(0, 0, 0, 0.9),
                0 0 0 12px gold,
                0 0 50px gold;
        }

        /* 手机端优化 */
        @media (max-width: 768px) {
            .wrapper {
                width: min(98vw, 800px);
                height: min(98vw, 800px);
            }

            .center-btn {
                font-size: 3vw;
            }
        }

        @media (max-width: 480px) {
            .wrapper {
                width: 98vw;
                height: 98vw;
            }

            .center-btn {
                font-size: 4vw;
            }
        }

        /* ===== 跑马灯 ===== */
        .lights {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
        }

        .bulb {
            position: absolute;
            width: 2.2%;
            height: 2.2%;
            border-radius: 50%;
            transition: all 0.08s linear;
        }

        /* 不同颜色的灯泡 */
        .bulb.color-1 {
            background: radial-gradient(circle at 30% 30%, #fff, #ffcc00 40%, #cc0000 70%);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.9),
                inset 0 -3px 6px rgba(0, 0, 0, 0.7),
                0 0 6px rgba(0, 0, 0, 0.6);
        }

        .bulb.color-2 {
            background: radial-gradient(circle at 30% 30%, #fff, #4fc3f7 40%, #1976d2 70%);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.9),
                inset 0 -3px 6px rgba(0, 0, 0, 0.7),
                0 0 6px rgba(0, 0, 0, 0.6);
        }

        .bulb.color-3 {
            background: radial-gradient(circle at 30% 30%, #fff, #81c784 40%, #388e3c 70%);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.9),
                inset 0 -3px 6px rgba(0, 0, 0, 0.7),
                0 0 6px rgba(0, 0, 0, 0.6);
        }

        .bulb.color-4 {
            background: radial-gradient(circle at 30% 30%, #fff, #ce93d8 40%, #7b1fa2 70%);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.9),
                inset 0 -3px 6px rgba(0, 0, 0, 0.7),
                0 0 6px rgba(0, 0, 0, 0.6);
        }

        /* 激活状态的灯泡 */
        .bulb.active {
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        .bulb.color-1.active {
            background: radial-gradient(circle at 30% 30%, #fff, #fff176 40%, #ff9800 70%);
            box-shadow:
                0 0 10px #fff176,
                0 0 25px gold,
                0 0 40px orange;
        }

        .bulb.color-2.active {
            background: radial-gradient(circle at 30% 30%, #fff, #b3e5fc 40%, #0288d1 70%);
            box-shadow:
                0 0 10px #b3e5fc,
                0 0 25px #29b6f6,
                0 0 40px #0288d1;
        }

        .bulb.color-3.active {
            background: radial-gradient(circle at 30% 30%, #fff, #c8e6c9 40%, #2e7d32 70%);
            box-shadow:
                0 0 10px #c8e6c9,
                0 0 25px #66bb6a,
                0 0 40px #2e7d32;
        }

        .bulb.color-4.active {
            background: radial-gradient(circle at 30% 30%, #fff, #f3e5f5 40%, #4a148c 70%);
            box-shadow:
                0 0 10px #f3e5f5,
                0 0 25px #ba68c8,
                0 0 40px #4a148c;
        }

        /* 脉冲动画 */
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* ===== 指针 ===== */
        .pointer {
            position: absolute;
            top: -6%;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4% solid transparent;
            border-right: 4% solid transparent;
            border-bottom: 9% solid gold;
            z-index: 20;
        }

        /* ===== 免费抽文字 ===== */
        .free-spin-text {
            position: absolute;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10vw;
            font-weight: bold;
            color: gold;
            text-shadow:
                0 0 10px gold,
                0 0 20px gold,
                0 0 30px gold,
                0 0 40px gold;
            z-index: 25;
            animation: freeSpinPulse 2s ease-in-out infinite alternate;
        }

        /* 免费抽文字动画 */
        @keyframes freeSpinPulse {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateX(-50%) scale(1.2);
                opacity: 0.8;
            }
        }

        /* 电脑端优化 */
        @media (min-width: 768px) {
            .free-spin-text {
                font-size: 60px;
                top: -20%;
            }
        }

        /* ===== 中间按钮 ===== */
        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4d4d, #7a0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2vw;
            max-font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow:
                inset 0 10px 20px rgba(255, 255, 255, 0.6),
                inset 0 -10px 20px rgba(0, 0, 0, 0.8),
                0 15px 40px rgba(0, 0, 0, 0.9);
            z-index: 10;
            animation: spinBtnPulse 1s ease-in-out infinite alternate;
        }

        /* 中间按钮文字动画 */
        @keyframes spinBtnPulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                box-shadow:
                    inset 0 10px 20px rgba(255, 255, 255, 0.6),
                    inset 0 -10px 20px rgba(0, 0, 0, 0.8),
                    0 15px 40px rgba(0, 0, 0, 0.9);
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.7;
                box-shadow:
                    inset 0 10px 20px rgba(255, 255, 255, 0.9),
                    inset 0 -10px 20px rgba(0, 0, 0, 0.5),
                    0 30px 70px rgba(255, 0, 0, 1);
            }
        }

        /* ===== 中奖弹窗 ===== */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            background: linear-gradient(45deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
            background-size: 400% 400%;
            animation: rainbow 4s infinite linear;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-size: clamp(18px, 4vw, 28px);
            box-shadow: 0 0 50px gold;
        }

        @keyframes rainbow {
            0% {
                background-position: 0% 50%
            }

            100% {
                background-position: 100% 50%
            }
        }

        .claim-btn {
            margin-top: 25px;
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff0080;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="free-spin-text">Free Spin</div>
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <div class="lights" id="lights"></div>
        <div class="center-btn" id="spinBtn">SPIN</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div id="resultText"></div>
            <button class="claim-btn" id="claimBtn">Claim Now</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const wrapper = document.querySelector(".wrapper");

        const prizes = [
            "Try Again",
            "iPhone 17 Pro Max",
            "Walmart-50",
            "Walmart-200",
            "Walmart-500",
            "Amazon-100",
            "Amazon-300",
            "Amazon-800"
        ];

        let prizeIndex = 1; // 必中 iPhone

        function resizeCanvas() {
            const size = wrapper.clientWidth;
            canvas.width = size;
            canvas.height = size;
            drawWheel();
            createLights();
        }
        window.addEventListener("resize", resizeCanvas);

        function drawWheel() {
            const center = canvas.width / 2;
            const radius = center * 0.88;
            const arc = Math.PI * 2 / prizes.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < prizes.length; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = i % 2 === 0 ? "#ffd54f" : "#fda085";
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + arc);
                ctx.fill();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arc / 2);

                // 根据屏幕尺寸调整文字和图标大小
                const screenWidth = window.innerWidth;
                let textSize, iconSize, textX, iconX;

                if (screenWidth < 320) { // 超小屏手机
                    textSize = center * 0.055;
                    iconSize = center * 0.065;
                    textX = radius - 25; // 文字位置（靠近图标）
                    iconX = radius - 5; // 图标靠近边缘
                } else if (screenWidth < 480) { // 小屏手机
                    textSize = center * 0.06;
                    iconSize = center * 0.07;
                    textX = radius - 28; // 文字位置（靠近图标）
                    iconX = radius - 5; // 图标靠近边缘
                } else if (screenWidth < 768) { // 大屏手机
                    textSize = center * 0.065;
                    iconSize = center * 0.08;
                    textX = radius - 30; // 文字位置（靠近图标）
                    iconX = radius - 5; // 图标靠近边缘
                } else { // 电脑端
                    textSize = center * 0.05;
                    iconSize = center * 0.08;
                    textX = radius - 50; // 文字位置
                    iconX = radius - 0; // 图标靠近边缘
                }

                // 绘制奖项文字
                ctx.fillStyle = "#000";
                ctx.font = textSize + "px Arial";
                ctx.textAlign = "right"; // 改回右对齐，更好地与图标对齐

                // 确保完整显示 iPhone 17 Pro Max
                let displayText = prizes[i];
                // 对于 iPhone 17 Pro Max 不进行截断
                if (displayText !== "iPhone 17 Pro Max" && displayText.length > 12) {
                    displayText = displayText.substring(0, 12) + '...';
                }

                // 绘制文字
                ctx.fillText(displayText, textX, 10);

                // 根据奖项类型绘制不同图标，确保图标靠近跑马灯且不遮挡文字
                ctx.font = iconSize + "px Arial";

                if (prizes[i] === "iPhone 17 Pro Max") {
                    ctx.fillText("📱", iconX, 12);
                } else {
                    ctx.fillText("🎁", iconX, 12);
                }

                ctx.restore();
            }
        }

        /* ===== 跑马灯 ===== */
        const lightsContainer = document.getElementById("lights");
        let bulbs = [];
        function createLights() {
            lightsContainer.innerHTML = "";
            bulbs = [];
            const size = wrapper.clientWidth;
            const radius = size * 0.47;
            const bulbCount = 70;

            for (let i = 0; i < bulbCount; i++) {
                const bulb = document.createElement("div");
                // 为每个灯泡分配不同的颜色类
                const colorClass = `color-${(i % 4) + 1}`;
                bulb.className = `bulb ${colorClass}`;
                const angle = (i / bulbCount) * Math.PI * 2;
                const x = size / 2 + radius * Math.cos(angle);
                const y = size / 2 + radius * Math.sin(angle);
                bulb.style.left = x + "px";
                bulb.style.top = y + "px";
                lightsContainer.appendChild(bulb);
                bulbs.push(bulb);
            }
        }

        // 跑马灯动画效果
        let index = 0;
        setInterval(() => {
            bulbs.forEach(b => b.classList.remove("active"));

            // 创建更丰富的灯光效果：主灯光+尾随效果
            for (let i = 0; i < 10; i++) {
                const bulbIndex = (index + i) % bulbs.length;
                if (bulbIndex >= 0 && bulbIndex < bulbs.length) {
                    const bulb = bulbs[bulbIndex];
                    bulb.classList.add("active");

                    // 为不同位置的灯泡设置不同的动画延迟
                    bulb.style.animationDelay = `${i * 0.03}s`;
                }
            }

            // 持续向前移动，确保完整环绕转盘
            index = (index + 1) % bulbs.length;
        }, 30);

        resizeCanvas();

        /* ===== 旋转 ===== */
        document.getElementById("spinBtn").onclick = function () {
            const finalAngle =
                360 * 8 +
                (360 - (prizeIndex * 360 / prizes.length) - 360 / prizes.length / 2);

            // 应用旋转动画
            canvas.style.transition = "transform 6s cubic-bezier(.17,.67,.12,.99)";
            canvas.style.transform = `rotate(${finalAngle}deg)`;

            // 旋转结束后，重绘转盘以保持文字正立
            setTimeout(() => {
                // 重置transform
                canvas.style.transition = "none";
                canvas.style.transform = "";

                // 重绘转盘
                drawWheel();

                // 显示中奖信息
                document.getElementById("resultText").innerHTML =
                    "🎉 CONGRATULATIONS!<br><br>You won:<br><b>" + prizes[prizeIndex] + "</b>";
                document.getElementById("modal").style.display = "flex";
            }, 6000);
        };

        document.getElementById("claimBtn").onclick = function () {
            window.location.href = "https://www.example.com";
        };
    </script>

</body>

</html>
