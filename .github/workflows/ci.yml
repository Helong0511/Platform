name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app -q
      - name: Run unit tests
        env:
          UNIT_TEST: "1"
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://127.0.0.1:6379/15"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"
          REDIS_DB: "15"
          ASONE_API_BASE_URL: "http://127.0.0.1:9"
          ASONE_API_KEY: ""
          TEST_API_BASE: "http://127.0.0.1:9"
          TELEGRAM_ENABLE: "false"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
          PRODUCTION_ENV: "development"
        # 收集仓库中所有测试文件；没有测试时必须失败，禁止“无测试绿色通过”。
        run: |
          shopt -s nullglob
          mapfile -t TEST_FILES < <(git ls-files 'tests/test_*.py' 'tests/**/test_*.py' | grep -v '^tests/manual/' || true)
          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "::error::No tests/test_*.py found; refusing to skip pytest."
            exit 1
          fi
          pytest "${TEST_FILES[@]}" -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install pinned Playwright browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Start isolated frontend server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/platform-vite.log 2>&1 &
          echo $! > /tmp/platform-vite.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-vite.log
          exit 1
      - name: Browser E2E (mock APIs; no production services)
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: node e2e/smoke.mjs
