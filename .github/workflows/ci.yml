name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app -q
      - name: Codebase audit
        run: python tests/audit_codebase.py
      - name: Deprecated refs audit
        run: python tests/audit_deprecated_refs.py
      - name: Frontend CRUD audit
        run: node tests/audit_frontend_crud_api.mjs
      - name: Run unit tests
        env:
          UNIT_TEST: "1"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
          PRODUCTION_ENV: "development"
        run: pytest tests/test_*.py -q --tb=short --ignore=tests/manual

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
