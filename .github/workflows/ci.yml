name: Emergency Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend security configuration tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify resolved Python dependency compatibility
        run: python -m pip check
      - name: Compile application
        run: python -m compileall app -q
      - name: Test explicit database configuration and safe probe import
        env:
          UNIT_TEST: "1"
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
          PRODUCTION_ENV: "development"
          ASONE_API_KEY: ""
          ASONE_API_BASE_URL: "http://127.0.0.1:9"
        run: pytest tests/test_database_config_security.py tests/test_asone_api_probe.py -v -rs --tb=short

  frontend:
    name: Frontend lint and build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
