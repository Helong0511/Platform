name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app -q
      - name: Run unit tests
        env:
          UNIT_TEST: "1"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
          PRODUCTION_ENV: "development"
        # 收集仓库中所有测试文件；没有测试时必须失败，禁止“无测试绿色通过”。
        run: |
          shopt -s nullglob
          mapfile -t TEST_FILES < <(git ls-files 'tests/test_*.py' 'tests/**/test_*.py' | grep -v '^tests/manual/' || true)
          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "::error::No tests/test_*.py found; refusing to skip pytest."
            exit 1
          fi
          pytest "${TEST_FILES[@]}" -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build
